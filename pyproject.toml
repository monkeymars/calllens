[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "seqgram"
version = "0.1.0"
description = "Turn a codebase into zoomable user sequence diagrams for vibe coding with an AI assistant"
requires-python = ">=3.10"
dependencies = []                       # Python projects: stdlib only

[project.optional-dependencies]
ts = ["tree-sitter>=0.23", "tree-sitter-typescript>=0.23"]   # TypeScript / JavaScript projects

[project.scripts]
seqgram = "seqgram.cli:main"

[tool.setuptools.packages.find]
include = ["seqgram*"]

[tool.setuptools.package-data]
"seqgram.render" = ["viewer.html"]
